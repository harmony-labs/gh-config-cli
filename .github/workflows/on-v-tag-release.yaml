name: On Version Tagged, Build and Publish Rust Binaries
on:
  push:
    tags:
    - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    uses: gitkb/workflows-rust/.github/workflows/release.yaml@v1.1.0
    with:
      binary_name: gh-config
      build_args: "--release --features vendored"
